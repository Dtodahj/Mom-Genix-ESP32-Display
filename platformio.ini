[platformio]
default_envs = cyd_ili9341, cyd_st7789
core_dir = .platformio

[env]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/d57f64c8b5f2bc5b8d10d121550806eeff7b06d9.zip
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -D USER_SETUP_LOADED
    -include include/board_setup.h

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D MOM_GENIX_ILI9341

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D MOM_GENIX_ST7789

[env:diagnostic_ili9341]
extends = env:cyd_ili9341
build_flags =
    ${env:cyd_ili9341.build_flags}
    -D MOM_GENIX_DIAGNOSTIC

[env:diagnostic_st7789]
extends = env:cyd_st7789
build_flags =
    ${env:cyd_st7789.build_flags}
    -D MOM_GENIX_DIAGNOSTIC
